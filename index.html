<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Quran Reader</title>
  <style>
    /* Dark brown + gold (default) */
    :root {
      --bg-color: #1a120b; --card-bg: #2b1f14; --card-inner: #3a2a1a;
      --accent: #d4af37; --text-dark: #f0e2c0; --text-light: #c9b586;
      --input-bg: #241a10; --input-text: #f0e2c0;
      --border: rgba(212, 175, 55, 0.35);
      --shadow: 0 10px 25px rgba(0,0,0,0.5);
      --inset-shadow: inset 0 2px 5px rgba(0,0,0,0.4);
      --focus-ring: #d4af37;
    }

    /* Light beige / brown / gold / yellow */
    body.light-mode {
      --bg-color: #f3ead5; --card-bg: #e9dcbe; --card-inner: #decfa8;
      --accent: #b8860b; --text-dark: #4a3525; --text-light: #7a5f3a;
      --input-bg: #fbf6ea; --input-text: #4a3525;
      --border: rgba(184, 134, 11, 0.4);
      --shadow: 0 10px 25px rgba(90, 60, 20, 0.15);
      --inset-shadow: inset 0 2px 5px rgba(90, 60, 20, 0.15);
      --focus-ring: #b8860b;
    }


    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; transition: background-color 0.3s ease, color 0.3s ease; }
    .app-container { width: 100%; max-width: 420px; background: var(--card-bg); border-radius: 32px; padding: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; border: 4px solid var(--border); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .app-title { font-weight: 800; font-size: 1rem; text-transform: uppercase; color: var(--text-dark); }
    .top-buttons { display: flex; gap: 8px; }
    .lang-btn, .theme-btn { background: var(--input-bg); color: var(--input-text); border: 2px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .cassette-deck { background: var(--card-inner); border-radius: 20px; padding: 16px; box-shadow: var(--inset-shadow); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .tape-window { width: 100%; height: 110px; background: #181515; border-radius: 12px; display: flex; justify-content: space-around; align-items: center; padding: 0 24px; position: relative; border: 3px solid #362f2e; }
    .reel { width: 50px; height: 50px; background: #ffffff; border-radius: 50%; border: 5px solid #110e0e; position: relative; display: flex; justify-content: center; align-items: center; }
    .reel-center { width: 16px; height: 16px; background: #110e0e; border-radius: 50%; }
    .reel-spoke { position: absolute; width: 100%; height: 3px; background: #110e0e; }
    .reel-spoke:nth-child(2) { transform: rotate(60deg); } .reel-spoke:nth-child(3) { transform: rotate(120deg); }
    .spinning { animation: spin 2.5s linear infinite; } @keyframes spin { 100% { transform: rotate(360deg); } }
    .tape-bridge { width: 50px; height: 16px; background: #362f2e; border-radius: 4px; }
    .track-info { text-align: center; width: 100%; }
    .track-title { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-subtitle { font-size: 0.85rem; color: var(--text-light); margin-top: 2px; }
    .controls-group { display: flex; flex-direction: column; gap: 10px; }
    .select-box { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--border); background-color: var(--input-bg) !important; color: var(--input-text) !important; font-size: 0.9rem; font-weight: 600; cursor: pointer; outline: none; }
    .select-box option { background-color: var(--input-bg) !important; color: var(--input-text) !important; }
    .time-bar { display: flex; align-items: center; gap: 10px; font-size: 0.75rem; color: var(--text-light); font-weight: 600; }
    .progress-range { flex: 1; accent-color: var(--accent); cursor: pointer; }
    .buttons-row { display: flex; justify-content: center; align-items: center; gap: 16px; }
    .btn { border: none; background: var(--input-bg); color: var(--input-text); border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .btn-small { width: 46px; height: 46px; font-size: 1rem; }
    .btn-large { width: 60px; height: 60px; font-size: 1.3rem; background: var(--accent); color: #ffffff; }
    *:focus-visible, *.tv-focused { outline: 3px solid var(--focus-ring) !important; outline-offset: 3px !important; }
  </style>
</head>
<body>


  <div class="app-container">
    <div class="top-bar">
      <div class="app-title" id="appTitle">Retro Quran</div>
      <div class="top-buttons">
        <button class="theme-btn tv-focusable" id="themeToggle" tabindex="0" title="Light mode">
          <span id="themeIcon">🌙</span>
        </button>
        <button class="lang-btn tv-focusable" id="langToggle" tabindex="0">
          <span id="langFlag">🇲🇦</span> <span id="langText">العربية</span>
        </button>
      </div>
    </div>


    <div class="cassette-deck">
      <div class="tape-window">
        <div class="reel" id="reelLeft"><div class="reel-spoke"></div><div class="reel-spoke"></div><div class="reel-spoke"></div><div class="reel-center"></div></div>
        <div class="tape-bridge"></div>
        <div class="reel" id="reelRight"><div class="reel-spoke"></div><div class="reel-spoke"></div><div class="reel-spoke"></div><div class="reel-center"></div></div>
      </div>
      <div class="track-info">
        <div class="track-title" id="displaySurah">---</div>
        <div class="track-subtitle" id="displayReciter">---</div>
      </div>
    </div>


    <div class="controls-group">
      <select id="reciterSelect" class="select-box tv-focusable" tabindex="0"></select>
      <select id="surahSelect" class="select-box tv-focusable" tabindex="0"></select>


      <div class="time-bar">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" class="progress-range tv-focusable" tabindex="0" value="0" min="0" max="100">
        <span id="durationTime">0:00</span>
      </div>


      <div class="buttons-row">
        <button class="btn btn-small tv-focusable" id="prevBtn" tabindex="0">⏮</button>
        <button class="btn btn-large tv-focusable" id="playBtn" tabindex="0">▶</button>
        <button class="btn btn-small tv-focusable" id="nextBtn" tabindex="0">⏭</button>
      </div>
    </div>
  </div>


  <audio id="audioPlayer"></audio>


  <script>
    const API_BASE = "https://mp3quran.net/api/v3";
    const audioPlayer = document.getElementById('audioPlayer');
    const reciterSelect = document.getElementById('reciterSelect');
    const surahSelect = document.getElementById('surahSelect');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const reelLeft = document.getElementById('reelLeft');
    const reelRight = document.getElementById('reelRight');
    const displaySurah = document.getElementById('displaySurah');
    const displayReciter = document.getElementById('displayReciter');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const langToggle = document.getElementById('langToggle');
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');


    var parsedRecitersList = [];
    let currentServer = "";
    let currentLang = 'fr';


    // Array containing exact Arabic names for all 114 Surahs
    var SURAH_NAMES_AR = [
      "الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس",
      "هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه",
      "الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
      "لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر",
      "فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق",
      "الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة",
      "الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج",
      "نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس",
      "التكوير","الإنفطار","المطففين","الإنشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد",
      "الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات",
      "القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر",
      "المسد","الإخلاص","الفلق","الناس"
    ];


    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      themeIcon.textContent = isLight ? '☀️' : '🌙';
      themeToggle.title = isLight ? 'Dark mode' : 'Light mode';
    }

    themeToggle.addEventListener('click', toggleTheme);


    async function loadReciters() {
      try {
        const langApi = currentLang === 'ar' ? 'ar' : 'eng';
        const label = currentLang === 'ar' ? "-- اختر القارئ --" : "-- Sélectionner Récitateur --";
        reciterSelect.innerHTML = `<option value="">${label}</option>`;
        const res = await fetch(`${API_BASE}/reciters?language=${langApi}`);
        const data = await res.json();

        parsedRecitersList = [];


        // Parse and isolate each available moshaf edition
        data.reciters.forEach((reciter) => {
          if (reciter.moshaf && reciter.moshaf.length > 0) {
            reciter.moshaf.forEach((m) => {
              const displayName = reciter.moshaf.length > 1
                ? `${reciter.name} (${m.name})`
                : reciter.name;


              parsedRecitersList.push({
                name: displayName,
                server: m.server,
                surahList: m.surah_list.split(',').map(Number)
              });
            });
          }
        });


        parsedRecitersList.sort((a, b) => a.name.localeCompare(b.name));


        parsedRecitersList.forEach((item, index) => {
          const opt = document.createElement('option');
          opt.value = index;
          opt.textContent = item.name;
          reciterSelect.appendChild(opt);
        });


      } catch (e) {
        displayReciter.textContent = currentLang === 'ar' ? "خطأ في الاتصال" : "Erreur réseau";
      }
    }


    langToggle.addEventListener('click', async () => {
      currentLang = currentLang === 'fr' ? 'ar' : 'fr';
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';


      document.getElementById('appTitle').textContent = currentLang === 'ar' ? "القرآن الكريم" : "Retro Quran";
      document.getElementById('langText').textContent = currentLang === 'ar' ? "Français" : "العربية";
      document.getElementById('langFlag').textContent = currentLang === 'ar' ? "🇫🇷" : "🇲🇦";
      displayReciter.textContent = currentLang === 'ar' ? "اختر قارئاً" : "Choisissez un Récitateur";
      displaySurah.textContent = currentLang === 'ar' ? "-- اختر السورة --" : "-- Sélectionner Sourate --";


      await loadReciters();
    });


    reciterSelect.addEventListener('change', (e) => {
      const idx = e.target.value;
      if (idx === "") return;


      const selectedReciter = parsedRecitersList[idx];
      displayReciter.textContent = selectedReciter.name;


      currentServer = selectedReciter.server;
      const availableSurahs = selectedReciter.surahList;


      const defaultText = currentLang === 'ar' ? "-- اختر السورة --" : "-- Sélectionner Sourate --";
      surahSelect.innerHTML = `<option value="">${defaultText}</option>`;


      availableSurahs.forEach(id => {
        const opt = document.createElement('option');
        opt.value = id;
        const arabicName = SURAH_NAMES_AR[id - 1] || `Sourate ${id}`;
        opt.textContent = currentLang === 'ar'
          ? `${id}. سورة ${arabicName}`
          : `Sourate ${id} - ${arabicName}`;
        surahSelect.appendChild(opt);
      });
    });


    surahSelect.addEventListener('change', (e) => {
      const surahNum = e.target.value;
      if (!surahNum || !currentServer) return;


      const formattedNum = String(surahNum).padStart(3, '0');
      audioPlayer.src = `${currentServer}${formattedNum}.mp3`;


      displaySurah.textContent = e.target.options[e.target.selectedIndex].text;
      audioPlayer.play().catch(err => {
        console.warn("Audio playback issue:", err);
      });
      updatePlayState(true);
    });


    // Auto-detect unavailable streams on audio error
    audioPlayer.addEventListener('error', () => {
      updatePlayState(false);
      displaySurah.textContent = currentLang === 'ar' ? "غير متوفر حالياً" : "Fichier non disponible";
    });


    playBtn.addEventListener('click', () => {
      if (!audioPlayer.src) return;
      if (audioPlayer.paused) {
        audioPlayer.play();
        updatePlayState(true);
      } else {
        audioPlayer.pause();
        updatePlayState(false);
      }
    });


    function updatePlayState(isPlaying) {
      playBtn.textContent = isPlaying ? '⏸' : '▶';
      if (isPlaying) {
        reelLeft.classList.add('spinning');
        reelRight.classList.add('spinning');
      } else {
        reelLeft.classList.remove('spinning');
        reelRight.classList.remove('spinning');
      }
    }


    audioPlayer.addEventListener('timeupdate', () => {
      if (audioPlayer.duration) {
        progressBar.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
        durationTimeEl.textContent = formatTime(audioPlayer.duration);
      }
    });


    progressBar.addEventListener('input', () => {
      if (audioPlayer.duration) {
        audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
      }
    });


    audioPlayer.addEventListener('ended', () => updatePlayState(false));


    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }


    nextBtn.addEventListener('click', () => {
      if (surahSelect.selectedIndex < surahSelect.options.length - 1) {
        surahSelect.selectedIndex++;
        surahSelect.dispatchEvent(new Event('change'));
      }
    });


    prevBtn.addEventListener('click', () => {
      if (surahSelect.selectedIndex > 1) {
        surahSelect.selectedIndex--;
        surahSelect.dispatchEvent(new Event('change'));
      }
    });


    /* Remote Control Navigation */
    window.addEventListener('keydown', (e) => {
      const focusables = Array.from(document.querySelectorAll('.tv-focusable'));
      let index = focusables.indexOf(document.activeElement);


      switch (e.key) {
        case 'ArrowRight':
        case 'ArrowDown':
          if (document.activeElement.tagName === 'INPUT' && document.activeElement.type === 'range') return;
          e.preventDefault();
          index = (index + 1) % focusables.length;
          focusables[index].focus();
          break;
        case 'ArrowLeft':
        case 'ArrowUp':
          if (document.activeElement.tagName === 'INPUT' && document.activeElement.type === 'range') return;
          e.preventDefault();
          index = (index - 1 + focusables.length) % focusables.length;
          focusables[index].focus();
          break;
        case 'MediaPlayPause':
        case 'MediaPlay':
        case 'MediaPause':
          e.preventDefault();
          playBtn.click();
          break;
        case 'MediaTrackNext':
          e.preventDefault();
          nextBtn.click();
          break;
        case 'MediaTrackPrevious':
          e.preventDefault();
          prevBtn.click();
          break;
      }
    });


    loadReciters();
  </script>
</body>
</html>
